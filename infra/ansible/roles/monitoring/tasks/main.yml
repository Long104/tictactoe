---
- name: Install Prometheus
  block:
    - name: Create prometheus user
      user:
        name: prometheus
        system: yes
        shell: /bin/false

    - name: Create Prometheus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus
        - /var/log/prometheus

    - name: Download Prometheus
      get_url:
        url: https://github.com/prometheus/prometheus/releases/download/v2.48.0/prometheus-2.48.0.linux-amd64.tar.gz
        dest: /tmp/prometheus.tar.gz

    - name: Extract Prometheus
      unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Install Prometheus binaries
      copy:
        src: "/tmp/prometheus-2.48.0.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: '0755'
        remote_src: yes
      loop:
        - prometheus
        - promtool

    - name: Install Prometheus configuration
      copy:
        src: /tmp/prometheus-2.48.0.linux-amd64/consoles
        dest: /etc/prometheus/
        remote_src: yes

    - name: Install Prometheus console libraries
      copy:
        src: /tmp/prometheus-2.48.0.linux-amd64/console_libraries
        dest: /etc/prometheus/
        remote_src: yes

    - name: Create Prometheus config
      copy:
        dest: /etc/prometheus/prometheus.yml
        content: |
          global:
            scrape_interval: 15s
            evaluation_interval: 15s

          scrape_configs:
            - job_name: 'prometheus'
              static_configs:
                - targets: ['localhost:9090']

            - job_name: 'node_exporter'
              static_configs:
                - targets: ['localhost:9100']

            - job_name: 'jenkins'
              static_configs:
                - targets: ['<JENKINS_IP>:8080']

    - name: Create systemd service for Prometheus
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus Monitoring
          After=network.target

          [Service]
          User=prometheus
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus \
            --web.console.templates=/etc/prometheus/consoles \
            --web.console.libraries=/etc/prometheus/console_libraries
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Start and enable Prometheus
      service:
        name: prometheus
        state: started
        enabled: yes

- name: Install Node Exporter
  block:
    - name: Download Node Exporter
      get_url:
        url: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
        dest: /tmp/node_exporter.tar.gz

    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Install Node Exporter
      copy:
        src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        remote_src: yes

    - name: Create Node Exporter service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          ExecStart=/usr/local/bin/node_exporter
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Start and enable Node Exporter
      service:
        name: node_exporter
        state: started
        enabled: yes

- name: Install Grafana
  block:
    - name: Add Grafana repository
      get_url:
        url: https://packages.grafana.com/gpg.key
        dest: /etc/pki/rpm-gpg/grafana.key
        mode: '0644'

    - name: Create Grafana repo file
      copy:
        dest: /etc/yum.repos.d/grafana.repo
        content: |
          [grafana]
          name=Grafana
          baseurl=https://packages.grafana.com/oss/rpm
          repo=latest
          gpgcheck=1
          gpgkey=https://packages.grafana.com/gpg.key

    - name: Install Grafana
      package:
        name: grafana
        state: present

    - name: Configure Grafana
      copy:
        dest: /etc/grafana/grafana.ini
        content: |
          [server]
          http_port = 3000
          domain = monitoring.example.com

          [security]
          admin_user = admin
          admin_password = admin123

          [database]
          type = sqlite3

    - name: Start and enable Grafana
      service:
        name: grafana-server
        state: started
        enabled: yes

    - name: Install Grafana plugins
      grafana_plugin:
        name: grafana-piechart-panel
        state: present
      ignore_errors: yes

- name: Install K6 Load Testing
  block:
    - name: Add K6 repository
      shell: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list

    - name: Install K6
      package:
        name: k6
        state: present
      ignore_errors: yes

    - name: Create K6 test directory
      file:
        path: /opt/k6-tests
        state: directory
        mode: '0755'

- name: Install Alertmanager
  block:
    - name: Create alertmanager user
      user:
        name: alertmanager
        system: yes
        shell: /bin/false

    - name: Create alertmanager directories
      file:
        path: "{{ item }}"
        state: directory
        owner: alertmanager
        group: alertmanager
        mode: '0755'
      loop:
        - /etc/alertmanager
        - /var/lib/alertmanager

    - name: Download Alertmanager
      get_url:
        url: https://github.com/prometheus/alertmanager/releases/download/v0.26.0/alertmanager-0.26.0.linux-amd64.tar.gz
        dest: /tmp/alertmanager.tar.gz

    - name: Extract Alertmanager
      unarchive:
        src: /tmp/alertmanager.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Install Alertmanager
      copy:
        src: "/tmp/alertmanager-0.26.0.linux-amd64/alertmanager"
        dest: "/usr/local/bin/alertmanager"
        mode: '0755'
        remote_src: yes

    - name: Copy amtool
      copy:
        src: "/tmp/alertmanager-0.26.0.linux-amd64/amtool"
        dest: "/usr/local/bin/amtool"
        mode: '0755'
        remote_src: yes

    - name: Create Alertmanager config
      copy:
        dest: /etc/alertmanager/alertmanager.yml
        content: |
          global:
            resolve_timeout: 5m

          route:
            group_by: ['alertname']
            group_wait: 10s
            group_interval: 10s
            repeat_interval: 12h
            receiver: 'email'
            routes:
              - match:
                  severity: critical
                receiver: 'email'
                continue: true

          receivers:
            - name: 'email'
              email_configs:
                - to: 'alerts@example.com'
                  from: 'alertmanager@example.com'
                  smarthost: 'smtp.example.com:587'
                  auth_username: 'alertmanager@example.com'
                  auth_password: 'changeme'

          inhibit_rules:
            - source_match:
                severity: 'critical'
              target_match:
                severity: 'warning'
              equal: ['alertname', 'instance']

    - name: Create Alertmanager service
      copy:
        dest: /etc/systemd/system/alertmanager.service
        content: |
          [Unit]
          Description=Alertmanager
          After=network.target

          [Service]
          User=alertmanager
          ExecStart=/usr/local/bin/alertmanager \
            --config.file=/etc/alertmanager/alertmanager.yml \
            --storage.path=/var/lib/alertmanager
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Start and enable Alertmanager
      service:
        name: alertmanager
        state: started
        enabled: yes

- name: Open firewall ports
  firewalld:
    port: "{{ item }}/tcp"
    permanent: yes
    state: enabled
  loop:
    - 9090
    - 9100
    - 3000
    - 9093
  when: ansible_os_family == "RedHat"
  ignore_errors: yes