apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tictactoe-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1s"
  labels:
    app: tictactoe
spec:
  tls:
    - hosts:
        - tictactoe.example.com
        - www.tictactoe.example.com
      secretName: tictactoe-tls
  rules:
    - host: tictactoe.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tictactoe-backend
                port:
                  number: 80
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: tictactoe-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tictactoe-frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
spec:
  controller: k8s.io/ingress-nginx