apiVersion: v1
kind: ConfigMap
metadata:
  name: tictactoe-config
  namespace: production
data:
  redis.host: "redis.production.svc.cluster.local"
  redis.port: "6379"
  app.log_level: "info"
  app.node_env: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: tictactoe-secrets
  namespace: production
type: Opaque
stringData:
  redis_password: "changeme"
  jwt_secret: "changeme-jwt-secret"
  api_key: "changeme-api-key"