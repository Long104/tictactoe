apiVersion: v1
kind: Service
metadata:
  name: tictactoe-backend
  namespace: production
  labels:
    app: tictactoe
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: tictactoe
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: tictactoe-frontend
  namespace: production
  labels:
    app: tictactoe
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: tictactoe
    component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: tictactoe-backend-nodeport
  namespace: production
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: tictactoe
    component: backend