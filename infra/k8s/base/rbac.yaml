apiVersion: v1
kind: ServiceAccount
metadata:
  name: tictactoe-sa
  namespace: production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/tictactoe-eks-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tictactoe-role
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tictactoe-role-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: tictactoe-sa
    namespace: production
roleRef:
  kind: Role
  name: tictactoe-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tictactoe-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: tictactoe-sa
    namespace: production
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io